;------------------------------------------------------------------------------
; J-Link Flash Utility Configuration Example File
;------------------------------------------------------------------------------
; This configuration file controls flash programming for Microchip devices.
; Copy, edit, and use with your target and utility script.
;------------------------------------------------------------------------------

[MBX_FLAGS]
;-------------------------------
; SPI Device Selection (SPI_SEL)
;-------------------------------
; Select which SPI device/interface to use:
;   0 = INT_SPI        ; Internal SPI
;   1 = SHD_SPI_CS0    ; Shared, Chip Select 0
;   2 = SHD_SPI_CS1    ; Shared, Chip Select 1
;   3 = PVT_SPI_CS0   ; Private0, Chip Select 0
;   4 = PVT_SPI_CS1   ; Private0, Chip Select 1
SPI_SEL = 0

;-------------------------------
; SPI Voltage Level (18V)
;-------------------------------
; Set to true to use 1.8V, false to use 3.3V (default).
18V = false

;-----------------------------------------------
; Write/Clear SPI Device Status Register (WSR)
;-----------------------------------------------
; If true, clears SPI device status register after operation.
; If false, status register is not modified.
WSR = false

;--------------------------
; SPI Mode Selection (QUAD)
;--------------------------
; Choose SPI mode:
;   true  = Enable Quad SPI mode
;   false = Use Single SPI mode (default)
QUAD = false

;------------------------------------------------------------------------------
[SECTOR_LIST]
;------------------------------------------------------------------------------
; Define the sectors/regions to be programmed. Each entry specifies:
;   sector[<index>] = <START_ADDRESS>,<LENGTH>
; - <START_ADDRESS>: hexadecimal start address for the sector
; - <LENGTH>:        hexadecimal length in bytes

sector[0] = 0x0,      0x4000
sector[1] = 0x8000,   0x18000
sector[2] = 0x30000,  0x10000

;------------------------------------------------------------------------------
; To add more sectors, continue numbering. Example:
; sector[3] = 0x40000, 0x8000
; sector[4] = 0x48000, 0x8000
;------------------------------------------------------------------------------