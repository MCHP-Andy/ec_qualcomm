# 1. 重置
reset halt

# 2. 載入 ELF (會進到 0x000B0000)
load_image C:/Users/A78501/Desktop/zephyr_main/build/zephyr/zephyr.elf

# 3. 從載入位址 0x000B0000 讀取向量表
# 不要再讀 0x00118000 了，那邊現在是空的或是 Data
mem2array vtable 32 0x000B0000 2

# 4. 關鍵：設定暫存器
reg msp $vtable(0)
reg pc $vtable(1)

# 5. 檢查 (這步很重要，如果 PC 是 0x000Cxxxx 且載入位址是 0x000Bxxxx 是正常的)
echo "Current MSP: [reg msp], Current PC: [reg pc]"

# 6. 執行
resume
