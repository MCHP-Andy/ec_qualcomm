# 選擇你的傳輸介面 (以 CMSIS-DAP 為例，若是 J-Link 改為 jlink.cfg)
source [find interface/jlink.cfg]
transport select swd

# 定義目標晶片 (Cortex-M4 通用設定)
set CHIPNAME mec1757
source [find target/swj-dp.tcl]

set _CHIPNAME $CHIPNAME
set _ENDIAN little
set _CPUTAPID 0x2ba01477  ;# 這是 Cortex-M4 的標準 ID

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -chain-position $_TARGETNAME

# 設定工作區 RAM (用於加快燒錄，可設為你 0xb0000 之後的一塊區域)
$_TARGETNAME configure -work-area-phys 0x00100000 -work-area-size 0x4000 -work-area-backup 0
