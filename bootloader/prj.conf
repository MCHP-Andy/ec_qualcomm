# Bootloader

CONFIG_EC_BOOTLOADER=y

# Driver
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_SPI=y
CONFIG_FLASH=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_SHELL=y
CONFIG_GPIO_SHELL=n
CONFIG_I2C_SHELL=n
CONFIG_FLASH_SHELL=n

CONFIG_EVENTS=y
CONFIG_REBOOT=y
CONFIG_CRC=y

# RETENTION
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y

# For Bootloader
CONFIG_USE_DT_CODE_PARTITION=y
