# Firmware version (Major.Minor.Patch)
CONFIG_APP_FW_VERSION_MAJOR=0
CONFIG_APP_FW_VERSION_MINOR=1
CONFIG_APP_FW_VERSION_PATCH=13


# Driver
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_FLASH=y

# Logging
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_FLASH_SHELL=y

CONFIG_PWM=y
CONFIG_PWM_SHELL=y

CONFIG_SENSOR=y

CONFIG_I2C=y
CONFIG_I2C_TARGET=y

CONFIG_EVENTS=y

CONFIG_REBOOT=y

# RETENTION
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y

# Compiler
# CONFIG_DEBUG_OPTIMIZATIONS=y

# Power Management
CONFIG_PM=y
CONFIG_PM_POLICY_CUSTOM=y

# For Bootloader
CONFIG_USE_DT_CODE_PARTITION=y
